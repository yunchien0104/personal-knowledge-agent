[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-brain-worker"
version = "0.1.0"
description = "Personal Brain durable job worker baseline"
requires-python = ">=3.13"
dependencies = ["pypdf==6.21.1"]

[project.scripts]
personal-brain-worker = "personal_brain.runner:cli"

[tool.setuptools.packages.find]
where = ["src"]
